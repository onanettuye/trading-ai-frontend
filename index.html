<script>

/* =========================================================
   NAVI FRONTEND CONFIGURATION
   ========================================================= */

/*
   IMPORTANT:
   This is your public backend.
   DO NOT use 127.0.0.1 here.
*/

const API_URL = "https://cyberspace.tail754c2f.ts.net";


/* =========================================================
   MARKET CONFIGURATION
   ========================================================= */

const marketConfig = {

    BTCUSD: {
        price: "btc-price",
        change: "btc-change",
        trend: "btc-trend"
    },

    XAUUSD: {
        price: "xau-price",
        change: "xau-change",
        trend: "xau-trend"
    },

    EURUSD: {
        price: "eur-price",
        change: "eur-change",
        trend: "eur-trend"
    },

    US30: {
        price: "us30-price",
        change: "us30-change",
        trend: "us30-trend"
    },

    NAS100: {
        price: "nas-price",
        change: "nas-change",
        trend: "nas-trend"
    }

};


/* =========================================================
   PREVIOUS PRICES
   ========================================================= */

const previousPrices = {};


/* =========================================================
   FORMAT PRICE
   ========================================================= */

function formatPrice(symbol, price) {

    if (
        price === null ||
        price === undefined ||
        !Number.isFinite(Number(price))
    ) {

        return "--";

    }


    const number = Number(price);


    if (symbol === "EURUSD") {

        return number.toFixed(5);

    }


    return number.toFixed(2);

}


/* =========================================================
   UPDATE MARKET CARD
   ========================================================= */

function updateMarketCard(symbol, market) {

    const config =
        marketConfig[symbol];


    if (!config) {

        return;

    }


    const priceElement =
        document.getElementById(
            config.price
        );


    const changeElement =
        document.getElementById(
            config.change
        );


    const trendElement =
        document.getElementById(
            config.trend
        );


    if (
        !priceElement ||
        !changeElement ||
        !trendElement
    ) {

        return;

    }


    /*
       Check whether this market is actually live.
    */

    if (
        !market ||
        market.status !== "LIVE" ||
        market.price === null ||
        market.price === undefined
    ) {

        priceElement.textContent =
            "--";


        changeElement.textContent =
            "NO LIVE DATA";


        changeElement.className =
            "market-change error";


        trendElement.textContent =
            "NO DATA";


        return;

    }


    const currentPrice =
        Number(
            market.price
        );


    if (
        !Number.isFinite(currentPrice)
    ) {

        priceElement.textContent =
            "--";

        return;

    }


    const previousPrice =
        previousPrices[symbol];


    /*
       Display price.
    */

    priceElement.textContent =
        formatPrice(
            symbol,
            currentPrice
        );


    /*
       Determine price movement.
    */

    if (
        previousPrice !== undefined &&
        currentPrice > previousPrice
    ) {

        priceElement.classList.remove(
            "price-down"
        );


        priceElement.classList.add(
            "price-up"
        );


        changeElement.textContent =
            "▲ PRICE RISING";


        changeElement.className =
            "market-change live";

    }


    else if (
        previousPrice !== undefined &&
        currentPrice < previousPrice
    ) {

        priceElement.classList.remove(
            "price-up"
        );


        priceElement.classList.add(
            "price-down"
        );


        changeElement.textContent =
            "▼ PRICE FALLING";


        changeElement.className =
            "market-change error";

    }


    else {

        changeElement.textContent =
            "● LIVE";


        changeElement.className =
            "market-change live";

    }


    /*
       Use backend trend if available.
    */

    if (market.trend) {

        trendElement.textContent =
            String(
                market.trend
            ).toUpperCase();

    }

    else if (
        previousPrice !== undefined
    ) {

        if (currentPrice > previousPrice) {

            trendElement.textContent =
                "RISING";

        }

        else if (
            currentPrice < previousPrice
        ) {

            trendElement.textContent =
                "FALLING";

        }

        else {

            trendElement.textContent =
                "FLAT";

        }

    }

    else {

        trendElement.textContent =
            "LIVE";

    }


    previousPrices[symbol] =
        currentPrice;

}


/* =========================================================
   LOAD LIVE MARKETS
   ========================================================= */

async function loadMarkets() {

    try {

        const response =
            await fetch(
                `${API_URL}/markets`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Market request failed: ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
           Backend format:

           {
               "status": "LIVE",
               "markets": {...}
           }
        */

        if (
            !data ||
            !data.markets
        ) {

            throw new Error(
                "Backend returned no market data"
            );

        }


        /*
           Update all markets.
        */

        Object.keys(
            data.markets
        ).forEach(
            symbol => {

                updateMarketCard(
                    symbol,
                    data.markets[symbol]
                );

            }
        );


        /*
           Update last refresh time.
        */

        const updateElement =
            document.getElementById(
                "market-update"
            );


        if (updateElement) {

            updateElement.textContent =
                "MT5 market feed updated • " +
                new Date().toLocaleTimeString();

        }


        /*
           Backend and market feed are working.
        */

        setSystemOnline(
            true
        );


        return true;

    }


    catch (error) {

        console.error(
            "NAVI market error:",
            error
        );


        setSystemOffline();


        return false;

    }

}


/* =========================================================
   LOAD BACKEND / MT5 STATUS
   ========================================================= */

async function loadSystemStatus() {

    try {

        const response =
            await fetch(
                `${API_URL}/`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Backend status failed: ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
           Your backend currently returns:

           {
               "message": "NAVI backend is working",
               "mt5_connected": true,
               "ollama_model": "llama3.2",
               "markets": [...]
           }
        */


        const backendWorking =
            data.message ===
            "NAVI backend is working";


        const mt5Connected =
            data.mt5_connected === true;


        /*
           Backend status.
        */

        const backendStatus =
            document.getElementById(
                "backend-status"
            );


        if (backendStatus) {

            backendStatus.textContent =
                backendWorking
                    ? "ONLINE"
                    : "OFFLINE";

        }


        /*
           MT5 status.
        */

        const mt5Status =
            document.getElementById(
                "mt5-status"
            );


        if (mt5Status) {

            mt5Status.textContent =
                mt5Connected
                    ? "CONNECTED"
                    : "OFFLINE";

        }


        /*
           Overall connection.
        */

        if (
            backendWorking &&
            mt5Connected
        ) {

            setSystemOnline(
                true
            );

        }

        else if (
            backendWorking
        ) {

            setSystemOnline(
                false
            );

        }


        return true;

    }


    catch (error) {

        console.error(
            "NAVI system status error:",
            error
        );


        setSystemOffline();


        return false;

    }

}


/* =========================================================
   LOAD ACCOUNT
   ========================================================= */

async function loadAccount() {

    try {

        const response =
            await fetch(
                `${API_URL}/account`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Account request failed: ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !data.account
        ) {

            throw new Error(
                "Backend returned no account data"
            );

        }


        const account =
            data.account;


        /*
           ACCOUNT BALANCE
        */

        const balance =
            Number(
                account.balance
            );


        document.getElementById(
            "balance"
        ).textContent =
            Number.isFinite(balance)
                ? "$" + balance.toFixed(2)
                : "--";


        /*
           EQUITY
        */

        const equity =
            Number(
                account.equity
            );


        document.getElementById(
            "equity"
        ).textContent =
            Number.isFinite(equity)
                ? "$" + equity.toFixed(2)
                : "--";


        /*
           FLOATING P&L
        */

        const pnl =
            Number(
                account.profit
            );


        const pnlElement =
            document.getElementById(
                "floating-pnl"
            );


        if (
            Number.isFinite(pnl)
        ) {

            pnlElement.textContent =
                (pnl >= 0 ? "+" : "-") +
                "$" +
                Math.abs(pnl).toFixed(2);


            pnlElement.classList.remove(
                "positive",
                "price-down"
            );


            if (
                pnl >= 0
            ) {

                pnlElement.classList.add(
                    "positive"
                );

            }

            else {

                pnlElement.classList.add(
                    "price-down"
                );

            }

        }

        else {

            pnlElement.textContent =
                "--";

        }


        /*
           OPEN POSITIONS
        */

        try {

            const positions =
                await fetch(
                    `${API_URL}/positions`,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (
                positions.ok
            ) {

                const positionData =
                    await positions.json();


                document.getElementById(
                    "open-positions"
                ).textContent =
                    positionData.count ?? 0;

            }

            else {

                document.getElementById(
                    "open-positions"
                ).textContent =
                    "--";

            }

        }


        catch (positionError) {

            console.error(
                "NAVI positions error:",
                positionError
            );


            document.getElementById(
                "open-positions"
            ).textContent =
                "--";

        }


    }


    catch (error) {

        console.error(
            "NAVI account error:",
            error
        );


        document.getElementById(
            "balance"
        ).textContent =
            "--";


        document.getElementById(
            "equity"
        ).textContent =
            "--";


        document.getElementById(
            "floating-pnl"
        ).textContent =
            "--";


        document.getElementById(
            "open-positions"
        ).textContent =
            "--";

    }

}


/* =========================================================
   SYSTEM ONLINE
   ========================================================= */

function setSystemOnline(
    mt5Connected = true
) {

    const sidebarStatus =
        document.getElementById(
            "sidebar-status"
        );


    const topStatus =
        document.getElementById(
            "top-status"
        );


    const feedStatus =
        document.getElementById(
            "feed-status"
        );


    if (sidebarStatus) {

        sidebarStatus.textContent =
            mt5Connected
                ? "SYSTEM ONLINE"
                : "BACKEND ONLINE";

    }


    if (topStatus) {

        topStatus.textContent =
            mt5Connected
                ? "LIVE"
                : "BACKEND ONLINE";

    }


    if (feedStatus) {

        feedStatus.textContent =
            mt5Connected
                ? "LIVE"
                : "MT5 OFFLINE";

    }


    /*
       Status dots.
    */

    const sidebarDot =
        document.getElementById(
            "sidebar-status-dot"
        );


    const topDot =
        document.getElementById(
            "top-status-dot"
        );


    if (sidebarDot) {

        sidebarDot.style.background =
            mt5Connected
                ? "#36d98a"
                : "#e57373";

    }


    if (topDot) {

        topDot.style.background =
            mt5Connected
                ? "#36d98a"
                : "#e57373";

    }

}


/* =========================================================
   SYSTEM OFFLINE
   ========================================================= */

function setSystemOffline() {

    const sidebarStatus =
        document.getElementById(
            "sidebar-status"
        );


    const topStatus =
        document.getElementById(
            "top-status"
        );


    const backendStatus =
        document.getElementById(
            "backend-status"
        );


    const feedStatus =
        document.getElementById(
            "feed-status"
        );


    if (sidebarStatus) {

        sidebarStatus.textContent =
            "CONNECTION ERROR";

    }


    if (topStatus) {

        topStatus.textContent =
            "OFFLINE";

    }


    if (backendStatus) {

        backendStatus.textContent =
            "OFFLINE";

    }


    if (feedStatus) {

        feedStatus.textContent =
            "OFFLINE";

    }


    const sidebarDot =
        document.getElementById(
            "sidebar-status-dot"
        );


    const topDot =
        document.getElementById(
            "top-status-dot"
        );


    if (sidebarDot) {

        sidebarDot.style.background =
            "#e57373";

    }


    if (topDot) {

        topDot.style.background =
            "#e57373";

    }

}


/* =========================================================
   START NAVI
   ========================================================= */

async function initializeNAVI() {

    /*
       Check backend and MT5 first.
    */

    await loadSystemStatus();


    /*
       Load live market prices.
    */

    await loadMarkets();


    /*
       Load account information.
    */

    await loadAccount();

}


/* =========================================================
   LIVE REFRESH
   ========================================================= */

/*
   Market prices:
   every 1 second.
*/

setInterval(
    loadMarkets,
    1000
);


/*
   Backend / MT5 status:
   every 5 seconds.
*/

setInterval(
    loadSystemStatus,
    5000
);


/*
   Account:
   every 2 seconds.
*/

setInterval(
    loadAccount,
    2000
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

initializeNAVI();


/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

function toggleSidebar() {

    const sidebar =
        document.querySelector(
            ".sidebar"
        );


    if (sidebar) {

        sidebar.classList.toggle(
            "open"
        );

    }

}

</script>
